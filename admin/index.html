<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Lead Board · Jessica Kortum</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    /* Matches the public site: warm espresso base, antique gold accent. */
    --ink:#232019; --ink-2:#2e2a22; --ink-3:#18150f; --ink-4:#3d3628;
    --cream:#f4f0e6; --cream-soft:#d0c8b8; --sage:#9a9081;
    --brass:#c9a26b; --brass-bright:#e3c08c;
    --line-soft:rgba(244,240,230,.12); --line:rgba(201,162,107,.32);
    --hot:#dd7f4a; --warm:#c9a26b; --cold:#9a9081;
    --danger:#d97d72; --ok:#8fbf9a;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--sans);font-size:15px;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  a{color:var(--brass-bright)}

  /* ---------------- top bar ---------------- */
  header.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;background:var(--ink-3);border-bottom:1px solid var(--line-soft);
    position:sticky;top:0;z-index:30}
  .bar h1{font-family:var(--serif);font-size:1.3rem;font-weight:500;letter-spacing:-.01em}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .who{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--sage)}
  .who[hidden]{display:none}
  .who svg{color:var(--ok);flex-shrink:0}
  .who b{color:var(--cream-soft);font-weight:600}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:3px;
    font-size:.82rem;font-weight:600;letter-spacing:.02em;text-decoration:none;
    background:var(--brass);color:var(--ink-3);transition:background .2s,opacity .2s}
  .btn:hover{background:var(--brass-bright)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
  .btn.ghost:hover{background:rgba(127,166,208,.10);border-color:var(--brass)}
  .btn.danger{background:transparent;border:1px solid rgba(226,134,127,.5);color:var(--danger)}
  .btn.danger:hover{background:rgba(226,134,127,.12)}

  /* ---------------- filter row ---------------- */
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line-soft);background:var(--ink)}
  .search{position:relative;flex:1 1 260px;max-width:380px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sage);pointer-events:none}
  .search input{width:100%;padding:9px 12px 9px 34px;border-radius:3px;
    background:var(--ink-2);border:1px solid var(--line-soft)}
  .search input:focus{outline:none;border-color:var(--brass)}
  .tools select{padding:9px 12px;border-radius:3px;background:var(--ink-2);
    border:1px solid var(--line-soft);cursor:pointer}
  .tools select:focus{outline:none;border-color:var(--brass)}
  .stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:3px;
    background:var(--ink-2);border:1px solid var(--line-soft);font-size:.74rem;color:var(--sage);
    letter-spacing:.08em;text-transform:uppercase}
  .stat b{font-family:var(--serif);font-size:1.05rem;color:var(--cream);letter-spacing:0}
  .stat.is-hot b{color:var(--hot)}

  .banner{margin:14px 22px 0;padding:13px 16px;border-radius:3px;font-size:.87rem;
    border:1px solid rgba(226,134,127,.4);background:rgba(226,134,127,.10);color:#f2b9b4}
  .banner[hidden]{display:none}
  .skeleton{padding:40px 22px;color:var(--sage)}

  /* ---------------- board ---------------- */
  .board{flex:1;display:flex;gap:14px;padding:18px 22px 26px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 272px;background:var(--ink-3);border:1px solid var(--line-soft);border-radius:4px;
    display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
  .col.dragover{border-color:var(--brass);background:#101f33}
  .col-head{display:flex;align-items:center;gap:9px;padding:13px 15px 12px;
    border-bottom:1px solid var(--line-soft);border-top:2px solid var(--stage);
    border-radius:4px 4px 0 0;position:sticky;top:0;background:var(--ink-3);z-index:2}
  .col-head h2{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;font-weight:700;color:var(--cream-soft)}
  .col-head .n{margin-left:auto;font-size:.72rem;color:var(--sage);background:var(--ink-2);
    padding:2px 8px;border-radius:10px;min-width:24px;text-align:center}
  .col-body{padding:11px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .col-body::-webkit-scrollbar{width:7px}
  .col-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .col-empty{font-size:.79rem;color:var(--sage);text-align:center;padding:16px 8px;font-style:italic}

  .card{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:3px;
    padding:12px 13px;cursor:grab;transition:border-color .2s,transform .15s,box-shadow .2s;
    border-left:3px solid var(--prio)}
  .card:hover{border-color:var(--line);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.28)}
  .card.dragging{opacity:.4;cursor:grabbing}
  .card-top{display:flex;align-items:baseline;gap:8px}
  .card .nm{font-weight:600;font-size:.94rem;flex:1;word-break:break-word}
  .card .when{font-size:.7rem;color:var(--sage);white-space:nowrap}
  .card .it{font-size:.76rem;color:var(--brass);margin-top:3px}
  .card .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chip{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:3px 7px;border-radius:2px;background:rgba(127,166,208,.14);color:var(--cream-soft)}
  .chip.tag{background:transparent;border:1px solid var(--line-soft);color:var(--sage)}
  .chip.note{background:transparent;color:var(--sage);padding-left:0}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;
    border-top:1px solid var(--line-soft)}
  .card select{flex:1;font-size:.72rem;color:var(--cream-soft);background:var(--ink-3);
    border:1px solid var(--line-soft);border-radius:2px;padding:4px 5px;cursor:pointer}
  .card select:focus{outline:none;border-color:var(--brass)}

  /* ---------------- drawer ---------------- */
  .drawer-bg{position:fixed;inset:0;background:rgba(6,12,20,.72);z-index:40;display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--ink);
    z-index:41;border-left:1px solid var(--line-soft);transform:translateX(100%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:12px;padding:18px 22px;
    border-bottom:1px solid var(--line-soft);flex-shrink:0}
  .drawer-head h2{font-family:var(--serif);font-size:1.35rem;font-weight:500;flex:1}
  .drawer-head .x{font-size:1.6rem;line-height:1;color:var(--sage);padding:0 4px}
  .drawer-head .x:hover{color:var(--cream)}
  .drawer-body{padding:20px 22px 26px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
  .drawer-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:14px 22px;border-top:1px solid var(--line-soft);background:var(--ink-3);flex-shrink:0}
  .drawer-foot .spacer{margin-left:auto}
  .saved{font-size:.8rem;color:var(--ok)}

  .fset{display:flex;flex-direction:column;gap:7px}
  .fset > label{font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
  .fset input,.fset select,.fset textarea{width:100%;padding:10px 12px;border-radius:3px;
    background:var(--ink-2);border:1px solid var(--line-soft)}
  .fset input:focus,.fset select:focus,.fset textarea:focus{outline:none;border-color:var(--brass)}
  .fset textarea{resize:vertical;min-height:96px;line-height:1.55}
  .fset.invalid input,.fset.invalid select{border-color:var(--danger)}
  .fset .err{font-size:.75rem;color:var(--danger);display:none}
  .fset.invalid .err{display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .msg-box{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:3px;
    padding:13px;font-size:.88rem;color:var(--cream-soft);white-space:pre-wrap;word-break:break-word;
    max-height:180px;overflow-y:auto}
  .msg-box.empty{font-style:italic;color:var(--sage)}
  .notes-head{display:flex;align-items:center;gap:10px}
  .notes-head label{flex:1}
  .linkbtn{font-size:.74rem;font-weight:600;color:var(--brass-bright);letter-spacing:.02em}
  .linkbtn:hover{text-decoration:underline}
  .meta-line{font-size:.73rem;color:var(--sage);display:flex;flex-wrap:wrap;gap:4px 14px}

  @media(max-width:700px){
    .board{padding:14px;gap:11px}
    .col{flex:0 0 84vw;max-height:none}
    .stats{margin-left:0;width:100%}
    .grid2{grid-template-columns:1fr}
    .bar,.tools{padding:12px 15px}
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Lead Board</h1>
  <div class="bar-right">
    <span class="who" id="who" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
      <span><span class="who-label">Securely signed in as </span><b id="whoEmail"></b></span>
    </span>
    <button class="btn ghost" id="refresh" type="button">Refresh</button>
    <a class="btn ghost" href="/cdn-cgi/access/logout">Sign out</a>
  </div>
</header>

<div class="tools">
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Search name, email, phone, tags, notes…" aria-label="Search leads">
  </div>
  <select id="fPriority" aria-label="Filter by priority">
    <option value="">All priorities</option>
    <option value="hot">Hot</option>
    <option value="warm">Warm</option>
    <option value="cold">Cold</option>
  </select>
  <select id="fSource" aria-label="Filter by source"></select>
  <button class="btn" id="addLead" type="button">+ New lead</button>

  <div class="stats">
    <span class="stat">Total <b id="stTotal">0</b></span>
    <span class="stat">New <b id="stNew">0</b></span>
    <span class="stat is-hot">Hot <b id="stHot">0</b></span>
  </div>
</div>

<div class="banner" id="banner" hidden></div>
<div class="skeleton" id="skeleton">Loading leads…</div>
<div class="board" id="board" hidden></div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Lead detail">
  <div class="drawer-head">
    <h2 id="dTitle">Lead</h2>
    <button class="x" id="dClose" type="button" aria-label="Close">×</button>
  </div>

  <div class="drawer-body">
    <div class="grid2">
      <div class="fset" id="fs-name">
        <label for="dName">Name</label>
        <input id="dName" type="text" placeholder="Full name">
        <span class="err" id="err-name"></span>
      </div>
      <div class="fset" id="fs-phone">
        <label for="dPhone">Phone</label>
        <input id="dPhone" type="tel" placeholder="(813) 555-0142">
        <span class="err" id="err-phone"></span>
      </div>
    </div>

    <div class="fset" id="fs-email">
      <label for="dEmail">Email</label>
      <input id="dEmail" type="email" placeholder="name@email.com">
      <span class="err" id="err-email"></span>
    </div>

    <div class="grid2">
      <div class="fset">
        <label for="dStatus">Stage</label>
        <select id="dStatus"></select>
      </div>
      <div class="fset">
        <label for="dPriority">Priority</label>
        <select id="dPriority">
          <option value="hot">Hot</option>
          <option value="warm">Warm</option>
          <option value="cold">Cold</option>
        </select>
      </div>
    </div>

    <div class="grid2">
      <div class="fset">
        <label for="dSource">Source</label>
        <select id="dSource"></select>
      </div>
      <div class="fset">
        <label for="dIntent">Looking to</label>
        <input id="dIntent" type="text" placeholder="Buy a home" list="intentList">
        <datalist id="intentList">
          <option value="Buy a home"></option>
          <option value="Sell a home"></option>
          <option value="Both — buy and sell"></option>
          <option value="Just exploring / get a home value"></option>
          <option value="Rental"></option>
          <option value="Investment"></option>
        </datalist>
      </div>
    </div>

    <div class="fset">
      <label for="dTags">Tags <span style="text-transform:none;letter-spacing:0">(comma separated)</span></label>
      <input id="dTags" type="text" placeholder="first-time, waterfront, pre-approved">
    </div>

    <div class="fset" id="fs-message">
      <label>Their message</label>
      <div class="msg-box" id="dMsg"></div>
    </div>

    <div class="fset">
      <div class="notes-head">
        <label for="dNotes">Private notes</label>
        <button class="linkbtn" id="dStamp" type="button">+ Add dated entry</button>
      </div>
      <textarea id="dNotes" placeholder="Call summaries, budget, follow-up dates — only you see this."></textarea>
    </div>

    <div class="meta-line" id="dMeta"></div>
  </div>

  <div class="drawer-foot">
    <button class="btn" id="dSave" type="button">Save</button>
    <button class="btn ghost" id="dCancel" type="button">Cancel</button>
    <span class="saved" id="dSaved" hidden>Saved</span>
    <span class="spacer"></span>
    <button class="btn danger" id="dDelete" type="button">Delete</button>
  </div>
</aside>

<script>
  const STAGES = [
    { id:'new',            label:'New',            color:'#c9a26b' },
    { id:'contacted',      label:'Contacted',      color:'#e3c08c' },
    { id:'active',         label:'Touring',        color:'#dd7f4a' },
    { id:'under_contract', label:'Under Contract', color:'#b79bd4' },
    { id:'closed',         label:'Closed',         color:'#8fbf9a' },
    { id:'lost',           label:'Lost / Cold',    color:'#9a9081' }
  ];
  const SOURCES = [
    { id:'website',     label:'Website' },
    { id:'referral',    label:'Referral' },
    { id:'open_house',  label:'Open house' },
    { id:'sign_call',   label:'Sign call' },
    { id:'zillow',      label:'Zillow' },
    { id:'social',      label:'Social' },
    { id:'past_client', label:'Past client' },
    { id:'other',       label:'Other' }
  ];
  const SOURCE_LABEL = Object.fromEntries(SOURCES.map(s => [s.id, s.label]));
  const PRIO_COLOR = { hot:'var(--hot)', warm:'var(--warm)', cold:'var(--cold)' };

  const el = (id) => document.getElementById(id);
  const board = el('board'), banner = el('banner'), skeleton = el('skeleton');

  let leads = [];
  let activeId = null;      // null while creating a new lead
  let drawerOpen = false;

  /* ---------------- helpers ---------------- */

  function showBanner(msg){ banner.textContent = msg; banner.hidden = false; }
  function hideBanner(){ banner.hidden = true; }

  function ago(iso){
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return '';
    const mins = Math.floor((Date.now() - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd';
    return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function fullDate(iso){
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString();
  }
  const splitTags = (s) => String(s || '').split(',').map(t => t.trim()).filter(Boolean);

  function fillSelect(sel, items, valueKey, labelKey){
    sel.textContent = '';
    items.forEach(i => {
      const o = document.createElement('option');
      o.value = i[valueKey]; o.textContent = i[labelKey];
      sel.appendChild(o);
    });
  }

  async function api(path, options){
    const res = await fetch(path, Object.assign({ headers:{ 'Content-Type':'application/json' } }, options));
    if (res.status === 401){
      el('who').hidden = true;
      showBanner('Your admin session expired. Reload the page to sign in again.');
      throw new Error('unauthorized');
    }
    let body = null;
    try { body = await res.json(); } catch {}
    if (!res.ok) {
      const e = new Error((body && body.error) || ('Request failed (' + res.status + ')'));
      e.fieldErrors = body && body.errors;
      throw e;
    }
    return body;
  }

  /* ---------------- load + filter ---------------- */

  async function load(){
    try {
      const data = await api('/api/leads');
      leads = data.leads || [];
      if (data.user) { el('whoEmail').textContent = data.user; el('who').hidden = false; }
      hideBanner();
    } catch (err) {
      if (err.message !== 'unauthorized') showBanner(err.message);
    } finally {
      skeleton.hidden = true;
      board.hidden = false;
      render();
    }
  }

  function visibleLeads(){
    const q = el('q').value.trim().toLowerCase();
    const p = el('fPriority').value;
    const s = el('fSource').value;
    return leads.filter(l => {
      if (p && (l.priority || 'warm') !== p) return false;
      if (s && (l.source || 'website') !== s) return false;
      if (!q) return true;
      return [l.name, l.email, l.phone, l.intent, l.message, l.notes, l.tags]
        .some(v => String(v || '').toLowerCase().includes(q));
    });
  }

  function renderStats(list){
    el('stTotal').textContent = list.length;
    el('stNew').textContent   = list.filter(l => l.status === 'new').length;
    el('stHot').textContent   = list.filter(l => l.priority === 'hot').length;
  }

  /* ---------------- cards ----------------
     Lead text is attacker-controlled (anonymous public form), so every value
     goes in via textContent - never innerHTML.                              */

  function makeCard(lead){
    const card = document.createElement('article');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = lead.id;
    card.style.setProperty('--prio', PRIO_COLOR[lead.priority] || 'var(--warm)');

    const top = document.createElement('div');
    top.className = 'card-top';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = lead.name;
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = ago(lead.created_at);
    top.append(nm, when);
    card.appendChild(top);

    if (lead.intent){
      const it = document.createElement('div');
      it.className = 'it';
      it.textContent = lead.intent;
      card.appendChild(it);
    }

    const chips = document.createElement('div');
    chips.className = 'chips';
    const src = document.createElement('span');
    src.className = 'chip';
    src.textContent = SOURCE_LABEL[lead.source] || 'Other';
    chips.appendChild(src);
    splitTags(lead.tags).slice(0, 3).forEach(t => {
      const c = document.createElement('span');
      c.className = 'chip tag';
      c.textContent = t;
      chips.appendChild(c);
    });
    if (lead.notes && lead.notes.trim()){
      const n = document.createElement('span');
      n.className = 'chip note';
      n.textContent = '✎ notes';
      chips.appendChild(n);
    }
    card.appendChild(chips);

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Move ' + lead.name + ' to stage');
    fillSelect(sel, STAGES, 'id', 'label');
    sel.value = lead.status;
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', () => setStatus(lead.id, sel.value));
    foot.appendChild(sel);
    card.appendChild(foot);

    card.addEventListener('click', () => openDrawer(lead.id));
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', lead.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    return card;
  }

  function render(){
    const list = visibleLeads();
    renderStats(list);
    board.textContent = '';

    for (const stage of STAGES){
      const items = list.filter(l => l.status === stage.id);

      const col = document.createElement('section');
      col.className = 'col';
      col.style.setProperty('--stage', stage.color);

      const head = document.createElement('div');
      head.className = 'col-head';
      const h2 = document.createElement('h2');
      h2.textContent = stage.label;
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = items.length;
      head.append(h2, n);

      const body = document.createElement('div');
      body.className = 'col-body';
      if (!items.length){
        const empty = document.createElement('div');
        empty.className = 'col-empty';
        empty.textContent = 'Nothing here';
        body.appendChild(empty);
      } else {
        items.forEach(l => body.appendChild(makeCard(l)));
      }

      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', () => col.classList.remove('dragover'));
      col.addEventListener('drop', (e) => {
        e.preventDefault();
        col.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        if (id) setStatus(id, stage.id);
      });

      col.append(head, body);
      board.appendChild(col);
    }
  }

  async function setStatus(id, status){
    const lead = leads.find(l => l.id === id);
    if (!lead || lead.status === status) return;
    const previous = lead.status;
    lead.status = status;            // optimistic
    render();
    try {
      await api('/api/leads/' + encodeURIComponent(id), {
        method:'PATCH', body: JSON.stringify({ status })
      });
      hideBanner();
    } catch (err) {
      lead.status = previous;        // roll back so the board never lies
      render();
      if (err.message !== 'unauthorized') showBanner('Could not move that lead: ' + err.message);
    }
  }

  /* ---------------- drawer ---------------- */

  function setFieldError(name, msg){
    const fs = el('fs-' + name);
    if (!fs) return;
    fs.classList.toggle('invalid', !!msg);
    const e = el('err-' + name);
    if (e) e.textContent = msg || '';
  }
  function clearFieldErrors(){ ['name','email','phone'].forEach(n => setFieldError(n, '')); }

  function openDrawer(id){
    clearFieldErrors();
    el('dSaved').hidden = true;
    activeId = id;

    const lead = id ? leads.find(l => l.id === id) : null;
    if (id && !lead) return;

    el('dTitle').textContent = lead ? lead.name : 'New lead';
    el('dName').value     = lead ? lead.name : '';
    el('dEmail').value    = lead ? (lead.email || '') : '';
    el('dPhone').value    = lead ? (lead.phone || '') : '';
    el('dIntent').value   = lead ? (lead.intent || '') : '';
    el('dTags').value     = lead ? (lead.tags || '') : '';
    el('dNotes').value    = lead ? (lead.notes || '') : '';
    el('dStatus').value   = lead ? lead.status : 'new';
    el('dPriority').value = lead ? (lead.priority || 'warm') : 'warm';
    el('dSource').value   = lead ? (lead.source || 'website') : 'referral';

    // Website leads carry a message from the form; manual ones do not.
    const hasMsg = !!(lead && lead.message);
    el('fs-message').style.display = hasMsg ? '' : 'none';
    if (hasMsg) el('dMsg').textContent = lead.message;

    el('dDelete').style.display = lead ? '' : 'none';
    el('dMeta').textContent = lead
      ? 'Received ' + fullDate(lead.created_at) + '   ·   Updated ' + fullDate(lead.updated_at)
      : '';

    el('drawer').classList.add('open');
    el('drawer').setAttribute('aria-hidden', 'false');
    el('drawerBg').classList.add('open');
    drawerOpen = true;
    setTimeout(() => el('dName').focus(), 120);
  }

  function closeDrawer(){
    activeId = null;
    drawerOpen = false;
    el('drawer').classList.remove('open');
    el('drawer').setAttribute('aria-hidden', 'true');
    el('drawerBg').classList.remove('open');
  }

  function collect(){
    return {
      name:     el('dName').value.trim(),
      email:    el('dEmail').value.trim(),
      phone:    el('dPhone').value.trim(),
      intent:   el('dIntent').value.trim(),
      tags:     splitTags(el('dTags').value).join(', '),
      notes:    el('dNotes').value,
      status:   el('dStatus').value,
      priority: el('dPriority').value,
      source:   el('dSource').value
    };
  }

  async function saveDrawer(){
    clearFieldErrors();
    const payload = collect();

    // Mirror of the server rule: a name, and at least one way to reach them.
    if (!payload.name){ setFieldError('name', 'Name is required.'); el('dName').focus(); return; }
    if (!payload.email && !payload.phone){
      setFieldError('email', 'Add an email or a phone number.');
      el('dEmail').focus();
      return;
    }

    const btn = el('dSave');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      if (activeId){
        await api('/api/leads/' + encodeURIComponent(activeId), {
          method:'PATCH', body: JSON.stringify(payload)
        });
        Object.assign(leads.find(l => l.id === activeId), payload);
      } else {
        const res = await api('/api/leads', { method:'POST', body: JSON.stringify(payload) });
        // Reload rather than guess at server-assigned timestamps.
        activeId = res.id;
        await load();
        closeDrawer();
        hideBanner();
        return;
      }
      render();
      el('dSaved').hidden = false;
      hideBanner();
    } catch (err) {
      if (err.fieldErrors) {
        Object.entries(err.fieldErrors).forEach(([f, m]) => setFieldError(f, m));
      }
      if (err.message !== 'unauthorized') showBanner(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  }

  async function deleteLead(){
    if (!activeId) return;
    const lead = leads.find(l => l.id === activeId);
    if (!lead) return;
    if (!confirm('Delete the lead from ' + lead.name + '? This cannot be undone.')) return;
    const id = activeId;
    try {
      await api('/api/leads/' + encodeURIComponent(id), { method:'DELETE' });
      leads = leads.filter(l => l.id !== id);
      closeDrawer();
      render();
      hideBanner();
    } catch (err) {
      if (err.message !== 'unauthorized') showBanner('Could not delete: ' + err.message);
    }
  }

  // Prepends a dated heading so notes read as a running call log.
  function stampNote(){
    const ta = el('dNotes');
    const stamp = new Date().toLocaleDateString(undefined,
      { month:'short', day:'numeric', year:'numeric' });
    ta.value = '— ' + stamp + ' —\n\n' + (ta.value ? '\n' + ta.value : '');
    ta.focus();
    ta.setSelectionRange(stamp.length + 6, stamp.length + 6);
  }

  /* ---------------- wiring ---------------- */

  fillSelect(el('dStatus'), STAGES, 'id', 'label');
  fillSelect(el('dSource'), SOURCES, 'id', 'label');
  fillSelect(el('fSource'),
    [{ id:'', label:'All sources' }].concat(SOURCES), 'id', 'label');

  el('refresh').addEventListener('click', load);
  el('addLead').addEventListener('click', () => openDrawer(null));
  el('dClose').addEventListener('click', closeDrawer);
  el('dCancel').addEventListener('click', closeDrawer);
  el('drawerBg').addEventListener('click', closeDrawer);
  el('dSave').addEventListener('click', saveDrawer);
  el('dDelete').addEventListener('click', deleteLead);
  el('dStamp').addEventListener('click', stampNote);

  el('q').addEventListener('input', render);
  el('fPriority').addEventListener('change', render);
  el('fSource').addEventListener('change', render);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawerOpen) closeDrawer();
    // Ctrl/Cmd+S saves while the drawer is open.
    if (drawerOpen && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      saveDrawer();
    }
  });

  load();
</script>
</body>
</html>
