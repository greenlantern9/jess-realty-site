<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Lead Board · Jessica Kortum</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#16233a; --ink-2:#1f2f49; --ink-3:#0e1826;
    --cream:#eef2f8; --cream-soft:#bcc7d8; --sage:#8794a8;
    --brass:#7fa6d0; --brass-bright:#a9c6e8;
    --line-soft:rgba(238,242,248,.12); --line:rgba(127,166,208,.30);
    --danger:#e2867f; --ok:#7fc3a1;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:var(--brass-bright)}

  header.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:16px 22px;border-bottom:1px solid var(--line-soft);background:var(--ink-3);position:sticky;top:0;z-index:20}
  .bar h1{font-family:var(--serif);font-size:1.3rem;font-weight:500;letter-spacing:-.01em}
  .bar .who{font-size:.78rem;color:var(--sage);margin-left:auto}
  .btn{padding:8px 14px;border-radius:2px;font-size:.82rem;font-weight:600;letter-spacing:.03em;
    background:var(--brass);color:var(--ink-3);transition:background .2s}
  .btn:hover{background:var(--brass-bright)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
  .btn.ghost:hover{border-color:var(--brass);color:var(--brass-bright);background:transparent}
  .btn.danger{background:transparent;border:1px solid rgba(226,134,127,.5);color:var(--danger)}
  .btn.danger:hover{background:rgba(226,134,127,.12)}

  .banner{margin:16px 22px 0;padding:14px 16px;border-radius:2px;font-size:.88rem;
    border:1px solid rgba(226,134,127,.4);background:rgba(226,134,127,.10);color:#f2b9b4}
  .banner.info{border-color:var(--line);background:rgba(127,166,208,.10);color:var(--cream-soft)}
  .banner[hidden]{display:none}

  .board{flex:1;display:flex;gap:16px;padding:22px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 290px;background:var(--ink-3);border:1px solid var(--line-soft);border-radius:3px;
    display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
  .col.dragover{border-color:var(--brass);background:#101d30}
  .col-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-soft);
    position:sticky;top:0;background:var(--ink-3);border-radius:3px 3px 0 0}
  .col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);flex-shrink:0}
  .col-head h2{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--cream-soft);
    font-family:var(--sans)}
  .col-head .n{margin-left:auto;font-size:.74rem;color:var(--sage);background:var(--ink-2);
    padding:2px 8px;border-radius:10px;min-width:24px;text-align:center}
  .col-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .col-empty{font-size:.8rem;color:var(--sage);text-align:center;padding:18px 8px;font-style:italic}

  .card{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:2px;padding:13px 14px;
    cursor:grab;transition:border-color .2s,transform .15s}
  .card:hover{border-color:var(--line);transform:translateY(-1px)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card .nm{font-weight:600;font-size:.95rem}
  .card .it{font-size:.76rem;color:var(--brass);margin-top:3px}
  .card .msg{font-size:.82rem;color:var(--cream-soft);margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
  .card .ago{font-size:.72rem;color:var(--sage)}
  .card select{margin-left:auto;font-family:inherit;font-size:.72rem;color:var(--cream-soft);
    background:var(--ink-3);border:1px solid var(--line-soft);border-radius:2px;padding:3px 5px;cursor:pointer}
  .card select:focus{outline:none;border-color:var(--brass)}
  .card .note-flag{font-size:.72rem;color:var(--sage)}

  .drawer-bg{position:fixed;inset:0;background:rgba(6,12,20,.7);z-index:40;display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--ink);z-index:41;
    border-left:1px solid var(--line-soft);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;overflow-y:auto}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line-soft)}
  .drawer-head h2{font-family:var(--serif);font-size:1.5rem;font-weight:500;line-height:1.15}
  .drawer-head .x{margin-left:auto;font-size:1.5rem;line-height:1;color:var(--sage);padding:0 4px}
  .drawer-head .x:hover{color:var(--cream)}
  .drawer-body{padding:20px 22px;display:flex;flex-direction:column;gap:20px}
  .dl{display:flex;flex-direction:column;gap:11px}
  .dl .row{display:flex;gap:12px;font-size:.9rem;align-items:baseline}
  .dl .k{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);flex:0 0 82px;padding-top:2px}
  .dl .v{color:var(--cream);word-break:break-word}
  .msg-box{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:2px;padding:14px;
    font-size:.9rem;color:var(--cream-soft);white-space:pre-wrap;word-break:break-word}
  .msg-box.empty{font-style:italic;color:var(--sage)}
  label.lb{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:7px}
  select.big,textarea{width:100%;font-family:inherit;font-size:.92rem;color:var(--cream);background:var(--ink-2);
    border:1px solid var(--line-soft);border-radius:2px;padding:11px 12px}
  select.big:focus,textarea:focus{outline:none;border-color:var(--brass)}
  textarea{min-height:110px;resize:vertical}
  .drawer-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
  .saved{font-size:.8rem;color:var(--ok);align-self:center}

  .skeleton{padding:40px 22px;color:var(--sage);font-size:.9rem}

  @media(max-width:640px){
    .board{padding:14px;gap:12px}
    .col{flex:0 0 82vw;max-height:none}
    .bar{padding:13px 16px}
    .bar h1{font-size:1.1rem}
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Lead Board</h1>
  <button class="btn ghost" id="refresh" type="button">Refresh</button>
  <span class="who" id="who"></span>
</header>

<div class="banner" id="banner" hidden></div>
<div class="skeleton" id="skeleton">Loading leads…</div>
<div class="board" id="board" hidden></div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Lead detail">
  <div class="drawer-head">
    <h2 id="dName">—</h2>
    <button class="x" id="dClose" type="button" aria-label="Close">×</button>
  </div>
  <div class="drawer-body">
    <div class="dl">
      <div class="row"><span class="k">Looking to</span><span class="v" id="dIntent"></span></div>
      <div class="row"><span class="k">Email</span><span class="v" id="dEmail"></span></div>
      <div class="row"><span class="k">Phone</span><span class="v" id="dPhone"></span></div>
      <div class="row"><span class="k">Received</span><span class="v" id="dWhen"></span></div>
    </div>
    <div>
      <label class="lb">Their message</label>
      <div class="msg-box" id="dMsg"></div>
    </div>
    <div>
      <label class="lb" for="dStatus">Stage</label>
      <select class="big" id="dStatus"></select>
    </div>
    <div>
      <label class="lb" for="dNotes">Private notes</label>
      <textarea id="dNotes" placeholder="Call summary, budget, follow-up date…"></textarea>
    </div>
    <div class="drawer-actions">
      <button class="btn" id="dSave" type="button">Save</button>
      <button class="btn danger" id="dDelete" type="button">Delete</button>
      <span class="saved" id="dSaved" hidden>Saved</span>
    </div>
  </div>
</aside>

<script>
  const STAGES = [
    { id:'new',            label:'New',            color:'#7fa6d0' },
    { id:'contacted',      label:'Contacted',      color:'#a9c6e8' },
    { id:'active',         label:'Touring',        color:'#e8c88a' },
    { id:'under_contract', label:'Under Contract', color:'#c9a6e8' },
    { id:'closed',         label:'Closed',         color:'#7fc3a1' },
    { id:'lost',           label:'Lost / Cold',    color:'#8794a8' }
  ];
  const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s.id, s.label]));

  const el = (id) => document.getElementById(id);
  const board = el('board'), banner = el('banner'), skeleton = el('skeleton');
  let leads = [];
  let activeId = null;

  function showBanner(msg, kind){
    banner.textContent = msg;
    banner.className = 'banner' + (kind === 'info' ? ' info' : '');
    banner.hidden = false;
  }
  function hideBanner(){ banner.hidden = true; }

  function ago(iso){
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return '';
    const mins = Math.floor((Date.now() - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(iso).toLocaleDateString();
  }
  function fullDate(iso){
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString();
  }

  async function api(path, options){
    const res = await fetch(path, Object.assign({ headers:{ 'Content-Type':'application/json' } }, options));
    if (res.status === 401){
      showBanner('Your admin session expired. Reload the page to sign in again.');
      throw new Error('unauthorized');
    }
    let body = null;
    try { body = await res.json(); } catch {}
    if (!res.ok) throw new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    return body;
  }

  async function load(){
    try {
      const data = await api('/api/leads');
      leads = data.leads || [];
      if (data.user) el('who').textContent = data.user;
      hideBanner();
      render();
    } catch (err) {
      if (err.message !== 'unauthorized') showBanner(err.message);
      render();   // show the empty board rather than a blank page under the error
    } finally {
      skeleton.hidden = true;
      board.hidden = false;
    }
  }

  // Build cards with textContent, never innerHTML: lead fields are arbitrary
  // text typed by anonymous visitors and must never be parsed as markup.
  function makeCard(lead){
    const card = document.createElement('article');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = lead.id;

    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = lead.name;
    card.appendChild(nm);

    if (lead.intent){
      const it = document.createElement('div');
      it.className = 'it';
      it.textContent = lead.intent;
      card.appendChild(it);
    }

    if (lead.message){
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.textContent = lead.message;
      card.appendChild(msg);
    }

    const foot = document.createElement('div');
    foot.className = 'foot';

    const when = document.createElement('span');
    when.className = 'ago';
    when.textContent = ago(lead.created_at);
    foot.appendChild(when);

    if (lead.notes && lead.notes.trim()){
      const flag = document.createElement('span');
      flag.className = 'note-flag';
      flag.textContent = '• notes';
      foot.appendChild(flag);
    }

    // Dropdown as well as drag-and-drop: dragging is unreliable on touch,
    // and this board will mostly be read on a phone.
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Move ' + lead.name + ' to stage');
    for (const s of STAGES){
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      if (s.id === lead.status) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', () => setStatus(lead.id, sel.value));
    foot.appendChild(sel);

    card.appendChild(foot);

    card.addEventListener('click', () => openDrawer(lead.id));
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', lead.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    return card;
  }

  function render(){
    board.textContent = '';
    for (const stage of STAGES){
      const items = leads.filter(l => l.status === stage.id);

      const col = document.createElement('section');
      col.className = 'col';
      col.dataset.stage = stage.id;

      const head = document.createElement('div');
      head.className = 'col-head';
      const dot = document.createElement('span');
      dot.className = 'dot'; dot.style.background = stage.color;
      const h2 = document.createElement('h2');
      h2.textContent = stage.label;
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = items.length;
      head.append(dot, h2, n);

      const body = document.createElement('div');
      body.className = 'col-body';
      if (!items.length){
        const empty = document.createElement('div');
        empty.className = 'col-empty';
        empty.textContent = 'Nothing here';
        body.appendChild(empty);
      } else {
        for (const lead of items) body.appendChild(makeCard(lead));
      }

      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', () => col.classList.remove('dragover'));
      col.addEventListener('drop', (e) => {
        e.preventDefault();
        col.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        if (id) setStatus(id, stage.id);
      });

      col.append(head, body);
      board.appendChild(col);
    }
  }

  async function setStatus(id, status){
    const lead = leads.find(l => l.id === id);
    if (!lead || lead.status === status) return;
    const previous = lead.status;
    lead.status = status;           // optimistic
    render();
    try {
      await api('/api/leads/' + encodeURIComponent(id), {
        method:'PATCH',
        body: JSON.stringify({ status })
      });
      hideBanner();
    } catch (err) {
      lead.status = previous;       // roll back so the board never lies
      render();
      if (err.message !== 'unauthorized') showBanner('Could not move that lead: ' + err.message);
    }
  }

  function openDrawer(id){
    const lead = leads.find(l => l.id === id);
    if (!lead) return;
    activeId = id;

    el('dName').textContent = lead.name;
    el('dIntent').textContent = lead.intent || '—';
    el('dWhen').textContent = fullDate(lead.created_at);

    const emailCell = el('dEmail');
    emailCell.textContent = '';
    if (lead.email){
      const a = document.createElement('a');
      a.href = 'mailto:' + lead.email;
      a.textContent = lead.email;
      emailCell.appendChild(a);
    } else emailCell.textContent = '—';

    const phoneCell = el('dPhone');
    phoneCell.textContent = '';
    if (lead.phone){
      const a = document.createElement('a');
      a.href = 'tel:' + lead.phone.replace(/[^\d+]/g, '');
      a.textContent = lead.phone;
      phoneCell.appendChild(a);
    } else phoneCell.textContent = '—';

    const msgBox = el('dMsg');
    msgBox.textContent = lead.message || 'No message included.';
    msgBox.classList.toggle('empty', !lead.message);

    const statusSel = el('dStatus');
    statusSel.textContent = '';
    for (const s of STAGES){
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      if (s.id === lead.status) o.selected = true;
      statusSel.appendChild(o);
    }

    el('dNotes').value = lead.notes || '';
    el('dSaved').hidden = true;

    el('drawer').classList.add('open');
    el('drawer').setAttribute('aria-hidden', 'false');
    el('drawerBg').classList.add('open');
  }

  function closeDrawer(){
    activeId = null;
    el('drawer').classList.remove('open');
    el('drawer').setAttribute('aria-hidden', 'true');
    el('drawerBg').classList.remove('open');
  }

  async function saveDrawer(){
    if (!activeId) return;
    const lead = leads.find(l => l.id === activeId);
    if (!lead) return;
    const status = el('dStatus').value;
    const notes = el('dNotes').value;
    const btn = el('dSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await api('/api/leads/' + encodeURIComponent(activeId), {
        method:'PATCH',
        body: JSON.stringify({ status, notes })
      });
      lead.status = status;
      lead.notes = notes;
      render();
      el('dSaved').hidden = false;
      hideBanner();
    } catch (err) {
      if (err.message !== 'unauthorized') showBanner('Could not save: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  }

  async function deleteLead(){
    if (!activeId) return;
    const lead = leads.find(l => l.id === activeId);
    if (!lead) return;
    if (!confirm('Delete the lead from ' + lead.name + '? This cannot be undone.')) return;
    const id = activeId;
    try {
      await api('/api/leads/' + encodeURIComponent(id), { method:'DELETE' });
      leads = leads.filter(l => l.id !== id);
      closeDrawer();
      render();
      hideBanner();
    } catch (err) {
      if (err.message !== 'unauthorized') showBanner('Could not delete: ' + err.message);
    }
  }

  el('refresh').addEventListener('click', load);
  el('dClose').addEventListener('click', closeDrawer);
  el('drawerBg').addEventListener('click', closeDrawer);
  el('dSave').addEventListener('click', saveDrawer);
  el('dDelete').addEventListener('click', deleteLead);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  load();
</script>
</body>
</html>
